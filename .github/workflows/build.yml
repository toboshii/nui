name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the 32-bit MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686

      - name: Build the library and the demo module
        run: NUI_GXX=i686-w64-mingw32-g++ sh example/build.sh

      - name: An HD texture pack loads as the stock art
        run: sh test/hd_linux/run.sh

      - name: The controller hook on the client's real wrapper bytes
        run: |
          sudo apt-get install -y g++-multilib
          sh test/pad_linux/run.sh --self-test

      - name: The controller hook's Windows tests build (they run on Windows)
        run: NUI_NORUN=1 sh test/build_pad_test.sh

      - name: The keyboard hook on the client's real read bytes
        run: sh test/key_linux/run.sh --self-test

      - name: The keyboard hook's Windows tests build (they run on Windows)
        run: NUI_NORUN=1 sh test/build_key_test.sh

      - name: The keyboard bindings read on the client's real bytes
        run: sh test/binds_linux/run.sh --self-test

      - name: The keyboard bindings read's Windows test builds (it runs on Windows)
        run: NUI_NORUN=1 sh test/build_binds_test.sh

      - name: Frozen shared-memory layouts
        run: python3 test/frozen_check.py

      - name: The frozen check still catches a fault
        run: python3 test/frozen_check.py --self-test
